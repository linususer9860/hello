<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEO Checker — Audit any URL in seconds</title>
    <meta name="description" content="Free SEO checker. Paste a URL and get a report on title, meta description, headings, canonical, Open Graph, social images, and link reachability.">
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <header class="hero">
        <h1>SEO Checker</h1>
        <p class="tagline">Paste a URL. Get a quick audit of title, headings, social tags, and links.</p>
        <form id="check-form" class="form">
            <input
                id="url-input"
                type="url"
                name="url"
                placeholder="https://example.com"
                required
                autocomplete="url"
                autofocus
            >
            <button type="submit" id="submit-btn">Analyze</button>
        </form>
        <p class="hint">Works on any publicly reachable HTML page.</p>
    </header>

    <main id="results" class="results" aria-live="polite"></main>

    <footer class="footer">
        <p>Built with Vercel serverless functions. <a href="https://github.com/linususer9860/hello">Source</a>.</p>
    </footer>

    <script src="/script.js"></script>
</body>
</html>
